name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  windows:
    name: Windows (build, test, lint, audit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify Cargo.lock is up to date
        run: cargo check --locked

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --release --locked

      - name: cargo build --release
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build-release.ps1

      - name: cargo install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: wakemate-companion-windows-binary
          path: |
            target/release/wakemate-companion.exe
            target/release/wakemate-companion.build.json
          if-no-files-found: error

  macos:
    name: macOS (build headless target + package .dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Format, lint, and audit
        run: |
          cargo fmt --all -- --check
          cargo clippy --release --all-targets --locked -- -D warnings
          cargo install cargo-audit --locked
          cargo audit

      - name: cargo test
        run: cargo test --release --locked

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Package unsigned .dmg
        id: package
        run: |
          chmod +x installer/macos/package-macos.sh
          ./installer/macos/package-macos.sh

      - name: Upload macOS artifact (unsigned, see docs/MACOS_BUILD.md)
        uses: actions/upload-artifact@v4
        with:
          name: wakemate-companion-macos-unsigned-dmg
          path: |
            ${{ steps.package.outputs.artifact_path }}
            ${{ steps.package.outputs.checksum_path }}
            ${{ steps.package.outputs.provenance_path }}
            ${{ steps.package.outputs.sources_path }}
          if-no-files-found: error
